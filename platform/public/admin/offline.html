<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDECEA">
<title>Offline · Epsilon Admin</title>
<style>
  :root { --canvas: #EDECEA; --panel: #FFFFFF; --ink: #1B1A18; --text-2: #55524C; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --canvas: #1C1B19; --panel: #262522; --ink: #F1EFEB; --text-2: #B5B1AA; } }
  html, body { margin: 0; min-height: 100%; background: var(--canvas); color: var(--ink);
    font: 400 15px/1.55 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
  .card { width: min(380px, 100%); background: var(--panel); border-radius: 26px; padding: 28px 24px; text-align: center;
    box-shadow: 0 20px 50px -30px rgba(27, 26, 24, .45); }
  .mark { width: 44px; height: 44px; border-radius: 13px; margin: 0 auto 14px; display: grid; place-items: center;
    background: var(--ink); color: var(--panel); font: 400 26px/1 Georgia, serif; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: var(--text-2); }
  button { height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: #D9532F; color: #fff;
    font: 600 14px/1 inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="mark" aria-hidden="true">ε</div>
    <h1>You're offline</h1>
    <p>Approvals need a connection. Nothing was sent or changed. Try again when you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</main>
</body>
</html>
