  <!-- ═══ 404: the hero's framed field, coming apart ═══════════════════ -->
  <section class="win-sec hero-a sec--open nf" data-scene="epsilon">
    <div class="win">
      <div class="hero-a__in">
        <p class="nf__k reveal">Error 404</p>
        <h1 class="hero-a__title reveal">Outside tolerance.</h1>
        <p class="nf__read reveal">GET <span data-nf-path>this page</span> <b>→ nothing here</b></p>
        <div class="lockup reveal">
          <i class="mark" aria-hidden="true"></i>
          <a class="lockup__go" href="/">→ Back to the start</a>
        </div>
        <p class="nf__links reveal"><a href="/work/">The work</a><a href="/catalogue/">Catalogue</a><a href="/start/">Start a project</a></p>
      </div>
    </div>
  </section>

  <script>
    /* Echo the path that missed, as text — never as markup. */
    document.querySelector('[data-nf-path]').textContent = location.pathname;
  </script>
  <script type="module">
    /* The mark falls out of tolerance and pulls itself back, on a loop:
       holds as an epsilon, scatters, holds scattered, reassembles. Nothing
       loops under reduced motion, and a page without WebGL simply keeps
       its static text. */
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      import('/assets/js/scene.js').then(({ setState }) => {
        const cycle = () => {
          if (document.hidden) return;
          setState('scatter', { duration: 1600 });
          setTimeout(() => setState('epsilon', { duration: 2000 }), 2600);
        };
        setInterval(cycle, 8000);   // before the field is ready, setState is a no-op
      }).catch(() => {});
    }
  </script>
